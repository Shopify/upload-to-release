name: "Release"
on: [release]

jobs:
  check_pr:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: Shopify/upload-to-release@master
      with:
        name: LICENSE
        path: LICENSE
        content-type: text/plain
        repo-token: ${{ secrets.GITHUB_TOKEN }}
